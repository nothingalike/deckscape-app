name: Build desktop release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}
  NEUROSCAPE_SIGN_RELEASE: ${{ vars.RELEASE_SIGNED == 'true' }}

jobs:
  validate:
    name: Validate tagged source
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      mode: ${{ steps.release.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.5.0'
          package-manager-cache: false
      - name: Validate tag, version and commit
        id: release
        run: node tools/github-release.mjs prepare
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
          - target: mac-arm64
            runner: macos-15
          - target: mac-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.5.0'
          package-manager-cache: false
      - run: npm ci
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libfuse2 libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2
      - name: Build unsigned preview
        if: needs.validate.outputs.mode == 'unsigned-preview'
        run: node tools/github-release.mjs build ${{ matrix.target }}
      - name: Build signed Windows installer
        if: needs.validate.outputs.mode == 'signed' && runner.os == 'Windows'
        run: node tools/github-release.mjs build windows-x64
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Build signed and notarized Mac installer
        if: needs.validate.outputs.mode == 'signed' && runner.os == 'macOS'
        run: node tools/github-release.mjs build ${{ matrix.target }}
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          CSC_NAME: ${{ secrets.MAC_CSC_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Build Linux installer
        if: needs.validate.outputs.mode == 'signed' && runner.os == 'Linux'
        run: node tools/github-release.mjs build linux-x64
      - name: Check packaged app on Windows or Mac
        if: runner.os != 'Linux'
        run: node tools/desktop-smoke.mjs
      - name: Check packaged app on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tools/desktop-smoke.mjs
      - name: Keep this platform's installer and build record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installer-${{ matrix.target }}
          path: release/github-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  draft:
    name: Prepare player download page
    needs: [validate, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.5.0'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: installer-*
          path: release/github-assets
          merge-multiple: true
      - name: Verify all downloads and prepare the draft release
        run: node tools/github-release.mjs draft
        env:
          GH_TOKEN: ${{ github.token }}
